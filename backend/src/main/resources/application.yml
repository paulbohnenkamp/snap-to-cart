spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/snaptocart}
    username: ${SPRING_DATASOURCE_USERNAME:snaptocart}
    password: ${SPRING_DATASOURCE_PASSWORD:snaptocart}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
app:
  jwt-secret: ${JWT_SECRET:development-secret-change-me-please-123456}
  access-token-minutes: 15
  refresh-token-days: 30
  demo-mode: ${APP_DEMO_MODE:true}
  openai-api-key: ${OPENAI_API_KEY:}
  openai-model: ${OPENAI_MODEL:gpt-4.1-mini}
  kroger-client-id: ${KROGER_CLIENT_ID:}
  kroger-client-secret: ${KROGER_CLIENT_SECRET:}
  kroger-redirect-uri: ${KROGER_REDIRECT_URI:snaptocart://oauth/kroger}
